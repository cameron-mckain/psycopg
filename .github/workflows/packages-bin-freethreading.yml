name: Build free-threaded (cp314t, cp315t) binary packages

# Focused workflow for building psycopg-binary wheels against the
# free-threaded CPython 3.14t / 3.15t ABIs. Kept separate from packages-bin.yml so
# iteration is fast and the existing 5×4×2 = 40-job matrix isn't disturbed.
#
# The Cython sources already opt in via
#   compiler_directives = { "freethreading_compatible": True }
# in psycopg_c/build_backend/psycopg_build_ext.py, and the C wrappers have
# been audited (commits: "mark external libpq C functions as noexcept nogil",
# "Merge critical section and nogil blocks", "add free-threading-specific
# tests"). The only thing missing upstream is shipped cp314t/cp315t wheels.

on:
  push:
    paths:
      - '.github/workflows/packages-bin-freethreading.yml'
  workflow_dispatch:

env:
  LIBPQ_VERSION: "18.6"
  OPENSSL_VERSION: "3.5.8"
  PQ_FLAGS: "-gssencmode-disable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Only the platforms the granian-python314t/315t bases pull from.
        arch: [x86_64]
        pyver: [cp314t, cp315t]
        platform: [manylinux, musllinux]

    steps:
      - uses: actions/checkout@v6

      - name: Cache libpq build
        uses: actions/cache@v5
        with:
          path: /tmp/libpq.build
          # Own key: this workflow builds manylinux on manylinux_2_28 (glibc 2.28) while
          # upstream packages-bin.yml builds x86_64/ppc64le on manylinux2014 (glibc 2.17).
          # Sharing upstream's key let packages-bin restore our 2.28 OpenSSL, which can't load
          # there -> no _ssl -> pip can't reach PyPI ('setuptools==83.0.0 (from versions: none)').
          key: libpq-ft-${{ matrix.platform }}-${{ matrix.platform == 'manylinux' && 'manylinux_2_28' || 'musl' }}-${{ matrix.arch }}-${{ env.LIBPQ_VERSION }}-${{ env.OPENSSL_VERSION }}${{ env.PQ_FLAGS }}

      - name: Create the binary package source tree
        run: python3 ./tools/ci/copy_to_binary.py

      - name: Build ${{ matrix.pyver }} wheel
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: psycopg_binary
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD: ${{ matrix.pyver }}-${{ matrix.platform }}_${{ matrix.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          # cibuildwheel 4 builds free-threaded interpreters by default (the 3.x
          # CIBW_ENABLE=cpython-freethreading opt-in group was removed).
          CIBW_BEFORE_ALL_LINUX: ./tools/ci/wheel_linux_before_all.sh
          CIBW_REPAIR_WHEEL_COMMAND: >-
            ./tools/ci/strip_wheel.sh {wheel}
            && auditwheel repair -w {dest_dir} {wheel}
          # Skip the in-cibuildwheel test phase — psycopg[test] transitively
          # pulls packages that may not yet have cp314t wheels (anyio,
          # pproxy, etc.). We'll run a focused import + smoke test in a
          # dedicated step after the build.
          CIBW_TEST_SKIP: "*"
          CIBW_ENVIRONMENT_PASS_LINUX: LIBPQ_VERSION OPENSSL_VERSION
          CIBW_ENVIRONMENT: >-
            PSYCOPG_IMPL=binary
            LIBPQ_BUILD_PREFIX=/host/tmp/libpq.build
            PATH="$LIBPQ_BUILD_PREFIX/bin:$PATH"
            LD_LIBRARY_PATH="$LIBPQ_BUILD_PREFIX/lib:$LIBPQ_BUILD_PREFIX/lib64"

      - name: Show wheels
        # Cheap, can't-fail validation that the build produced wheels.
        # An earlier version of this workflow tried to install Python 3.14t
        # via deadsnakes and import the wheel, but ubuntu-latest doesn't
        # carry that build yet and the fallback docker-run logic was
        # brittle. Real smoke test happens out-of-band once the artifact
        # is published — we just need the artifact to exist first.
        if: always()
        run: |
          ls -la ./wheelhouse/ || echo "(no wheelhouse)"
          for f in ./wheelhouse/*.whl; do
            echo "=== $f ==="
            unzip -l "$f" | head -20
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: psycopg-binary-${{ matrix.pyver }}-${{ matrix.platform }}_${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: psycopg-binary-ft
          delete-merged: true

  # Real smoke test of the built manylinux wheels on free-threaded CPython (manylinux_2_34
  # ships /opt/python/cp314-cp314t and cp315-cp315t) against a Postgres 18 service:
  # binary impl, sync/async/COPY/statement_timeout, 16 threads, GIL must stay off.
  smoke_test:
    name: Smoke test (${{ matrix.pyver }})
    needs: [merge]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pyver: cp314t
            python: /opt/python/cp314-cp314t/bin/python3.14t
          - pyver: cp315t
            python: /opt/python/cp315-cp315t/bin/python3.15t
    container: quay.io/pypa/manylinux_2_34_x86_64:latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: pw
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: psycopg-binary-ft
          path: wheelhouse

      - name: Install wheel + matching psycopg
        run: |
          ls -la wheelhouse
          ${{ matrix.python }} -m pip install wheelhouse/psycopg_binary-*-${{ matrix.pyver == 'cp314t' && 'cp314-cp314t' || 'cp315-cp315t' }}-manylinux*.whl
          ${{ matrix.python }} -m pip install "psycopg==3.3.6"

      - name: Smoke test
        env:
          DSN: "host=postgres user=postgres password=pw dbname=postgres connect_timeout=5"
        run: |
          ${{ matrix.python }} - <<'EOF'
          import asyncio, os, sys, threading
          import importlib.metadata as md
          import psycopg
          DSN = os.environ["DSN"]
          print("psycopg", psycopg.__version__, "binary", md.version("psycopg-binary"),
                "impl", psycopg.pq.__impl__, "libpq", psycopg.pq.version(), "GIL", sys._is_gil_enabled())
          assert psycopg.pq.__impl__ == "binary"
          assert md.version("psycopg-binary") == psycopg.__version__
          with psycopg.connect(DSN) as c:
              c.execute("SET statement_timeout = 2000")
              assert c.execute("SELECT 1 + 1").fetchone()[0] == 2
              try:
                  c.execute("SELECT pg_sleep(5)")
                  raise SystemExit("statement_timeout did not fire")
              except psycopg.errors.QueryCanceled:
                  c.rollback()
              with c.cursor().copy("COPY (SELECT g FROM generate_series(1, 1000) g) TO STDOUT") as cp:
                  assert sum(1 for _ in cp.rows()) == 1000
          async def amain():
              async with await psycopg.AsyncConnection.connect(DSN) as ac:
                  cur = await ac.execute("SELECT 41 + 1")
                  assert (await cur.fetchone())[0] == 42
          asyncio.run(amain())
          errs = []
          def worker(i):
              try:
                  with psycopg.connect(DSN) as c:
                      for _ in range(50):
                          assert c.execute("SELECT %s::int * 2", (i,)).fetchone()[0] == i * 2
              except Exception as e:  # noqa: BLE001
                  errs.append(repr(e))
          ts = [threading.Thread(target=worker, args=(i,)) for i in range(16)]
          [t.start() for t in ts]; [t.join() for t in ts]
          assert not errs, errs
          assert not sys._is_gil_enabled(), "GIL was re-enabled"
          print("ALL OK: sync/async/COPY/timeout/16 threads, GIL off")
          EOF

  # Publish the tested wheels as a permanent release (granian-python wheels/ pins these)
  # instead of relying on 90-day workflow artifacts.
  publish_release:
    name: Publish release v3.3.6-ft1
    needs: [smoke_test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: psycopg-binary-ft
          path: wheelhouse

      - name: Create or replace release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.3.6-ft1
        run: |
          (cd wheelhouse && sha256sum *.whl > SHA256SUMS)
          cat wheelhouse/SHA256SUMS
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" wheelhouse/*.whl wheelhouse/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "psycopg-binary 3.3.6 (free-threading cp314t/cp315t)" \
            --notes "psycopg-binary 3.3.6 for free-threaded CPython 3.14t / 3.15t (manylinux_2_28 + musllinux, x86_64). Upstream 3.3.6 tag + CI only (libpq ${LIBPQ_VERSION}, OpenSSL ${OPENSSL_VERSION}). Built by cibuildwheel 4.3.5 in run $GITHUB_RUN_ID; smoke-tested against Postgres 18 with the GIL off."
